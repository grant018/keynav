<!doctype html>
<meta charset="utf-8">
<title>hints</title>
<style>
  body { font: 14px sans-serif; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  [contenteditable], #menu { border: 1px solid #888; padding: 2px 6px; }
  .tall { height: 3000px; }
</style>
<h1>Hints</h1>
<div class="row">
  <a id="link" href="frame.html">Go to frame</a>
  <button id="button">Button</button>
  <input id="input" placeholder="input">
  <input id="email" type="email" value="a@b.c">
  <input id="checkbox" type="checkbox">
  <select id="select"><option>one</option><option>two</option></select>
  <div id="ce" contenteditable="true">editable</div>
  <div id="menu" role="button" tabindex="0">Menu (reacts to pointerdown)</div>
  <span id="onclick" onclick="window.__events.push('onclick:click')">span with onclick</span>
</div>
<details id="details"><summary id="summary">More</summary><p>Details body</p></details>
<div class="row" id="many"></div>
<div class="tall"></div>
<script>
  window.__events = [];
  window.__log = [];
  for (const type of ['keydown', 'keypress', 'keyup']) {
    window.addEventListener(type, (e) => window.__log.push(`${type}:${e.key}`), true);
  }
  const button = document.getElementById('button');
  for (const type of ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click']) {
    button.addEventListener(type, () => window.__events.push(`button:${type}`));
  }
  document.getElementById('menu').addEventListener('pointerdown', () => window.__events.push('menu:pointerdown'));
  const many = document.getElementById('many');
  for (let i = 1; i <= 20; i++) {
    many.insertAdjacentHTML('beforeend', `<a id="l${i}" href="#n${i}">link ${i}</a>`);
  }
</script>
