<!doctype html>
<meta charset="utf-8">
<title>scroll (app shell)</title>
<style>
  /* App-shell layout: the window never scrolls; #main and #side do. */
  html, body { margin: 0; height: 100%; overflow: hidden; font: 14px sans-serif; }
  body { display: flex; }
  #side { width: 200px; overflow-y: auto; background: #f4f4f4; }
  #main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .tall { height: 4000px; background: linear-gradient(#eef, #fee); }
</style>
<nav id="side"><p id="side-top">Sidebar</p><div class="tall"></div></nav>
<main id="main"><h1 id="main-top">Main</h1><div class="tall"></div></main>
